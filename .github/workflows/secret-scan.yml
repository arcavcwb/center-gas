name: Secret Scan (Gitleaks)

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

# Este job es BLOQUEANTE: si gitleaks encuentra un secreto en los commits del PR,
# la acción termina con código distinto de 0 y el PR no puede mergearse.
jobs:
  gitleaks:
    name: Escaneo de secretos
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Historial completo: gitleaks necesita recorrer todos los commits del PR,
          # no solo el árbol final. Un secreto añadido y borrado en commits distintos
          # sigue estando en el historial y debe detectarse.
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Configuración propia (reglas por defecto + allowlist de placeholders).
          GITLEAKS_CONFIG: .gitleaks.toml
          # No publicar los hallazgos como comentario del PR ni como artefacto: el
          # repositorio es público y el informe contiene el secreto en claro. Los
          # resultados se leen en el log del job, que ya está restringido.
          GITLEAKS_ENABLE_COMMENTS: false
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
          # NOTA: gitleaks-action es gratuito para repositorios públicos y cuentas
          # personales. Si el repo pasa a pertenecer a una organización, hará falta
          # dar de alta el secreto GITLEAKS_LICENSE.
